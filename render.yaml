services:
  - type: web
    name: erp-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: SECRET_KEY
        value: change-me-please-change-me-please-123456
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ADMIN_EMAIL
        value: owner@example.com
      - key: ADMIN_PASSWORD
        value: changeme123
      - key: CORS_ORIGINS
        value: https://erp-frontend.onrender.com

  - type: static_site
    name: erp-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://erp-backend.onrender.com/api

databases:
  - name: erp-db
    plan: free
